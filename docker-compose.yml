services:
    # ---------- FRONTEND ----------
    frontend:
        build: ./frontend
        container_name: frontend
        restart: always
        networks:
            - ecommerce

    # ---------- USER SERVICE ----------
    user_backend:
        build: ./backend/modules/user_backend
        volumes:
            - ./backend/modules/user_backend:/app
            - ./shared:/shared
        container_name: user_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- CATEGORY SERVICE ----------
    category_backend:
        build: ./backend/modules/category_backend
        volumes:
            - ./backend/modules/category_backend:/app
            - ./shared:/shared
        container_name: category_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- PRODUCT SERVICE ----------
    product_backend:
        build: ./backend/modules/product_backend
        volumes:
            - ./backend/modules/product_backend:/app
            - ./shared:/shared
        container_name: product_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- ORDER SERVICE ----------
    order_backend:
        build: ./backend/modules/order_backend
        volumes:
            - ./backend/modules/order_backend:/app
            - ./shared:/shared
        container_name: order_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- PAYMENT SERVICE ----------
    payment_backend:
        build: ./backend/modules/payment_backend
        volumes:
            - ./backend/modules/payment_backend:/app
            - ./shared:/shared
        container_name: payment_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- CART SERVICE ----------
    cart_backend:
        build: ./backend/modules/cart_backend
        volumes:
            - ./backend/modules/cart_backend:/app
            - ./shared:/shared
        container_name: cart_backend
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - .env
        environment:
            PYTHONPATH: '/shared'
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            REDIS_URL: redis://redis:6379/1
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- DATABASE ----------
    postgres:
        image: postgres:17
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - ecommerce
        ports:
            - '5432:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ---------- CACHE ----------
    redis:
        image: redis:7-alpine
        container_name: redis
        restart: always
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '6379:6379'
        networks:
            - ecommerce
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5

    # ---------- MESSAGE QUEUE ----------
    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        restart: always
        ports:
            - '5672:5672'
            - '15672:15672'
        networks:
            - ecommerce
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmqctl', 'status']
            interval: 10s
            timeout: 5s
            retries: 5

    # ---------- REVERSE PROXY ----------
    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - '80:80'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - frontend
            - user_backend
            - category_backend
            - product_backend
            - order_backend
            - payment_backend
            - cart_backend
        networks:
            - ecommerce

networks:
    ecommerce:

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
