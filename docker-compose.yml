services:
    # ---------- FRONTEND ----------
    frontend:
        build: ./frontend
        container_name: frontend
        restart: always
        networks:
            - ecommerce

    # ---------- USER SERVICE ----------

    user_backend:
        build: ./backend/user_backend
        container_name: user_backend
        command: gunicorn user_backend.wsgi:application --bind 0.0.0.0:8000
        environment:
            - DB_HOST=mysql
            - DB_NAME=user_db
            - DB_USER=root
            - DB_PASSWORD=root
            - REDIS_HOST=redis
            - RABBITMQ_HOST=rabbitmq
        depends_on:
            - mysql
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- PRODUCT SERVICE ----------
    product_backend:
        build: ./backend/product_backend
        container_name: product_backend
        command: gunicorn product_backend.wsgi:application --bind 0.0.0.0:8000
        environment:
            - DB_HOST=mysql
            - DB_NAME=product_db
            - DB_USER=root
            - DB_PASSWORD=root
            - REDIS_HOST=redis
            - RABBITMQ_HOST=rabbitmq
        depends_on:
            - mysql
            - redis
            - rabbitmq
        networks:
            - ecommerce

    # ---------- ORDER SERVICE ----------
    order_backend:
        build: ./backend/order_backend
        container_name: order_backend
        command: gunicorn order_backend.wsgi:application --bind 0.0.0.0:8000
        environment:
            - DB_HOST=mysql
            - DB_NAME=order_db
            - DB_USER=root
            - DB_PASSWORD=root
            - RABBITMQ_HOST=rabbitmq
        depends_on:
            - mysql
            - rabbitmq
        networks:
            - ecommerce

    # ---------- PAYMENT SERVICE ----------
    payment_backend:
        build: ./backend/payment_backend
        container_name: payment_backend
        command: gunicorn payment_backend.wsgi:application --bind 0.0.0.0:8000
        environment:
            - DB_HOST=mysql
            - DB_NAME=payment_db
            - DB_USER=root
            - DB_PASSWORD=root
            - RABBITMQ_HOST=rabbitmq
        depends_on:
            - mysql
            - rabbitmq
        networks:
            - ecommerce

    # ---------- Cart SERVICE ----------
    cart_backend:
        build: ./backend/cart_backend
        container_name: cart_backend
        command: gunicorn cart_backend.wsgi:application --bind 0.0.0.0:8000
        environment:
            - DB_HOST=mysql
            - DB_NAME=payment_db
            - DB_USER=root
            - DB_PASSWORD=root
            - RABBITMQ_HOST=rabbitmq
        depends_on:
            - mysql
            - rabbitmq
        networks:
            - ecommerce

    # ---------- DATABASE ----------
    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - ecommerce

    # ---------- CACHE ----------
    redis:
        image: redis:7
        container_name: redis
        restart: always
        networks:
            - ecommerce

    # ---------- MESSAGE QUEUE ----------
    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - '5672:5672' # Broker
            - '15672:15672' # Management UI
        networks:
            - ecommerce

    # ---------- REVERSE PROXY ----------
    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - '80:80'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - frontend
            - user_backend
            - product_backend
            - order_backend
            - payment_backend
            - cart_backend
        networks:
            - ecommerce

networks:
    ecommerce:

volumes:
    mysql_data:
